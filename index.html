<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Design Field Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  :root {
    --ground:   #EEF2F1;
    --surface:  #FFFFFF;
    --raised:   #E3E9E8;
    --ink:      #111A1B;
    --ink-2:    #334244;
    --muted:    #5B6B6D;
    --line:     #D2DCDB;
    --line-soft:#E2E9E8;
    --accent:   #0E6863;
    --accent-2: #0A524E;
    --accent-wash:#E1EFED;
    --warn:     #9A4D12;
    --warn-wash:#F7EDE3;
    --done:     #2E6B2A;
    --done-wash:#E6F0E4;
    --diagram:  #F6F9F8;

    --c-key:    #8A2E6B;
    --c-str:    #2E6B2A;
    --c-num:    #9A4D12;
    --c-com:    #75868A;
    --c-type:   #1F5C96;
    --c-fn:     #5B3FA8;

    --rail: 312px;
    --maxw: 76ch;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:   #0C1213;
      --surface:  #121A1B;
      --raised:   #1A2425;
      --ink:      #E2ECEB;
      --ink-2:    #BCCBCA;
      --muted:    #8A9C9D;
      --line:     #243032;
      --line-soft:#1C2729;
      --accent:   #4FC2B8;
      --accent-2: #7AD6CD;
      --accent-wash:#0F2624;
      --warn:     #E8A15F;
      --warn-wash:#2A1D10;
      --done:     #7CC874;
      --done-wash:#13240F;
      --diagram:  #0F1718;

      --c-key:    #E08FC4;
      --c-str:    #8FD88A;
      --c-num:    #E8A96B;
      --c-com:    #6E8285;
      --c-type:   #79B4EC;
      --c-fn:     #B29BEC;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:   #0C1213;
    --surface:  #121A1B;
    --raised:   #1A2425;
    --ink:      #E2ECEB;
    --ink-2:    #BCCBCA;
    --muted:    #8A9C9D;
    --line:     #243032;
    --line-soft:#1C2729;
    --accent:   #4FC2B8;
    --accent-2: #7AD6CD;
    --accent-wash:#0F2624;
    --warn:     #E8A15F;
    --warn-wash:#2A1D10;
    --done:     #7CC874;
    --done-wash:#13240F;
    --diagram:  #0F1718;

    --c-key:    #E08FC4;
    --c-str:    #8FD88A;
    --c-num:    #E8A96B;
    --c-com:    #6E8285;
    --c-type:   #79B4EC;
    --c-fn:     #B29BEC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }

  /* ---------- rail ---------- */
  .rail {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding-block: 22px 40px;
    padding-inline: 18px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand .kicker {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .brand h1 {
    margin: 0; font-family: "Newsreader", Georgia, serif;
    font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em;
  }
  .brand .sub { font-size: 12.5px; color: var(--muted); }

  .edswitch {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 3px;
    background: var(--raised); border-radius: 9px;
  }
  .edswitch button {
    font: inherit; font-size: 12.5px; font-weight: 600; border: 0; border-radius: 7px;
    padding: 7px 8px; background: transparent; color: var(--ink-2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25;
  }
  .xlink {
    display: inline-block; margin-bottom: 18px; font-size: 13px; font-weight: 600;
    color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
    background: var(--accent-wash); border-radius: 7px; padding: 6px 11px;
  }
  .xlink:hover { color: var(--accent-2); }
  .xlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .edswitch button small {
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 10.5px; color: var(--muted);
  }
  .edswitch button[aria-pressed="true"] {
    background: var(--surface); color: var(--accent-2); box-shadow: 0 0 0 1px var(--line);
  }
  .edswitch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .meter { display: flex; flex-direction: column; gap: 7px; }
  .meter-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted);
  }
  .meter-top b { color: var(--ink); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
  .bar { height: 5px; border-radius: 99px; background: var(--raised); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s ease; }

  .phase { display: flex; flex-direction: column; gap: 3px; }
  .phase-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; padding: 0 6px 5px;
  }
  .phase-name {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .phase-week {
    font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted);
    white-space: nowrap;
  }

  .item {
    display: grid; grid-template-columns: 22px 30px minmax(0,1fr);
    align-items: center; gap: 8px;
    padding: 6px 6px; border-radius: 7px; line-height: 1.35;
  }
  .item:hover { background: var(--raised); }
  .item.active { background: var(--accent-wash); }
  .item.active .item-title { color: var(--accent-2); font-weight: 600; }

  .tick {
    width: 17px; height: 17px; border-radius: 5px;
    border: 1.5px solid var(--line); background: var(--surface);
    display: grid; place-items: center; padding: 0; cursor: pointer;
    color: transparent;
  }
  .tick svg { width: 11px; height: 11px; display: block; }
  .tick[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }
  .tick:focus-visible, .item-body:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .item-num {
    font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 500;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .item.active .item-num { color: var(--accent); }
  .item-body {
    min-width: 0; border: 0; background: none; padding: 0; text-align: left;
    font: inherit; color: inherit; cursor: pointer; border-radius: 4px;
  }
  .item-title { display: block; font-size: 13.5px; color: var(--ink); }
  .item-hook { display: block; font-size: 11.5px; color: var(--muted); }
  .item.done .item-title { color: var(--muted); }

  .flag {
    display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 4px;
    background: var(--accent-wash); color: var(--accent-2); border: 1px solid var(--accent);
    font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    vertical-align: 1px;
  }

  /* ---------- main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding-block: 10px; padding-inline: 20px;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .crumb {
    font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto;
  }
  .crumb b { color: var(--ink-2); font-weight: 500; }

  .btn {
    font: inherit; font-size: 12.5px; font-weight: 500;
    padding: 6px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.is-done { background: var(--done-wash); border-color: var(--done); color: var(--done); }
  .btn-icon { padding: 6px 9px; }
  .menu-btn { display: none; }

  .doc { padding-inline: 20px; padding-block: 34px 8px; width: 100%; }
  .doc-inner { max-width: var(--maxw); margin: 0 auto; }

  .jump {
    border: 1px solid var(--line-soft); background: var(--surface); border-radius: 9px;
    padding: 12px 16px; margin-bottom: 30px;
  }
  .jump-label {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 7px;
  }
  .jump ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 24px; }
  .jump li { break-inside: avoid; margin-bottom: 3px; }
  .jump a { font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
  .jump a:hover { color: var(--accent); text-decoration: underline; }

  /* markdown body */
  .md { color: var(--ink-2); }
  .md > *:first-child { margin-top: 0; }
  .md h1 {
    font-family: "Newsreader", Georgia, serif; font-weight: 600;
    font-size: clamp(27px, 4.6vw, 36px); line-height: 1.15; letter-spacing: -.015em;
    color: var(--ink); margin: 0 0 22px; text-wrap: balance;
  }
  .md h2 {
    font-family: "Newsreader", Georgia, serif; font-weight: 600;
    font-size: 23px; line-height: 1.28; color: var(--ink);
    margin: 48px 0 14px; padding-top: 18px; border-top: 1px solid var(--line);
    text-wrap: balance;
  }
  .md h3 { font-size: 16px; font-weight: 700; color: var(--ink); margin: 30px 0 10px; }
  .md h4 { font-size: 14.5px; font-weight: 600; color: var(--ink); margin: 22px 0 8px; }
  .md p { margin: 0 0 15px; }
  .md a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .md strong { color: var(--ink); font-weight: 600; }
  .md ul, .md ol { margin: 0 0 15px; padding-left: 22px; }
  .md li { margin-bottom: 5px; }
  .md li::marker { color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }

  .md blockquote {
    margin: 0 0 18px; padding: 12px 16px;
    border-left: 3px solid var(--accent); background: var(--accent-wash);
    border-radius: 0 8px 8px 0;
  }
  .md blockquote.blackbox { border-left-color: var(--muted); background: var(--raised); }
  .md .chip {
    display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 1px 7px; border-radius: 5px; margin-right: 4px; vertical-align: 1px;
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
  }
  .md .chip-how { background: var(--accent-wash); color: var(--accent-2); border-color: var(--accent); }
  .md .chip-ex { background: var(--warn-wash); color: var(--warn); border-color: var(--warn); }
  .md blockquote.mistake { border-left-color: var(--warn); background: var(--warn-wash); }
  .md blockquote > *:last-child { margin-bottom: 0; }

  .md code {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: .84em; background: var(--raised); color: var(--ink);
    padding: .13em .38em; border-radius: 4px;
  }
  .md pre {
    margin: 0 0 18px; padding: 15px 17px; overflow-x: auto;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 9px;
    line-height: 1.55;
  }
  .md pre code { background: none; padding: 0; border-radius: 0; font-size: 12.6px; color: var(--ink-2); }
  /* ASCII diagrams get a drafting-paper ground */
  .md pre.diagram {
    background-color: var(--diagram);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 18px 18px;
    border-color: var(--line);
  }
  .md pre.diagram code { color: var(--ink); line-height: 1.35; }

  .md details {
    margin: -6px 0 18px; border: 1px solid var(--line-soft); border-radius: 8px;
    background: var(--surface); padding: 0 14px;
  }
  .md details summary {
    cursor: pointer; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .md details[open] { padding-bottom: 6px; }
  .md details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .table-wrap {
    overflow-x: auto; margin: 0 0 20px;
    border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface);
  }
  .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .md th, .md td {
    text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
  }
  .md th {
    font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  .md tbody tr:last-child td { border-bottom: 0; }

  .hljs-comment, .hljs-quote { color: var(--c-com); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: var(--c-key); }
  .hljs-string, .hljs-regexp, .hljs-addition { color: var(--c-str); }
  .hljs-number, .hljs-symbol, .hljs-attribute { color: var(--c-num); }
  .hljs-type, .hljs-class .hljs-title, .hljs-title.class_, .hljs-built_in { color: var(--c-type); }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--c-fn); }
  .hljs-variable, .hljs-template-variable, .hljs-params { color: var(--ink-2); }
  .hljs-meta { color: var(--muted); }

  .pager {
    display: flex; gap: 12px; flex-wrap: wrap;
    max-width: var(--maxw); margin: 40px auto 0;
    padding-block: 22px 56px; border-top: 1px solid var(--line);
  }
  .pg {
    flex: 1 1 200px; min-width: 0; text-align: left;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    padding: 11px 14px; cursor: pointer; font: inherit; color: inherit;
  }
  .pg:hover { border-color: var(--accent); }
  .pg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pg .dir {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px;
  }
  .pg .nm { font-size: 13.5px; color: var(--ink); font-weight: 500; display: block; }
  .pg.next { text-align: right; }

  .loading { color: var(--muted); font-size: 13px; padding: 30px 0; }
  .scrim { display: none; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .rail {
      position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 60;
      transform: translateX(-102%); transition: transform .22s ease;
      box-shadow: 0 0 0 1px var(--line);
      padding-top: calc(22px + env(safe-area-inset-top, 0px));
    }
    .rail.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .scrim {
      display: block; position: fixed; inset: 0; z-index: 50;
      background: rgba(4,8,9,.5); opacity: 0; pointer-events: none; transition: opacity .22s ease;
      border: 0;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .doc { padding-block: 26px 8px; padding-inline: 16px; }
    .topbar { padding-inline: 16px; }
    .jump ul { columns: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Reading order">
    <div class="brand">
      <span class="kicker">HLD + LLD, from zero</span>
      <h1>System Design Field Notes</h1>
      <span class="sub" id="sub"></span>
    </div>

    <div class="edswitch" role="group" aria-label="Edition">
      <button type="button" id="ed-quick" aria-pressed="false">Quick<small>05-15</small></button>
      <button type="button" id="ed-compact" aria-pressed="false">Compact<small>~12 h</small></button>
      <button type="button" id="ed-full" aria-pressed="false">Full<small>~30 h</small></button>
    </div>

    <div class="meter">
      <div class="meter-top"><span>Progress</span><span><b id="meter-n">0</b> / <span id="meter-t">0</span></span></div>
      <div class="bar"><span id="meter-bar"></span></div>
    </div>

    <div id="nav"></div>
  </nav>

  <button class="scrim" id="scrim" aria-label="Close menu" tabindex="-1"></button>

  <main class="main">
    <div class="topbar">
      <button class="btn btn-icon menu-btn" id="menu" aria-label="Open reading order">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <span class="crumb" id="crumb"></span>
      <button class="btn" id="mark">Mark read</button>
      <button class="btn btn-icon" id="theme" aria-label="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
      </button>
    </div>

    <article class="doc">
      <div class="doc-inner">
        <div id="jump"></div>
        <div class="md" id="md"><p class="loading">Loading&hellip;</p></div>
      </div>
      <div class="pager">
        <button class="pg prev" id="prev" hidden><span class="dir">&larr; Previous</span><span class="nm"></span></button>
        <button class="pg next" id="next" hidden><span class="dir">Next &rarr;</span><span class="nm"></span></button>
      </div>
    </article>
  </main>
</div>

      { id: "11", file: "ch/11-messaging-and-kafka.md",        title: "Queues & Kafka",           hook: "Delivery semantics, outbox, events", flag: "core" },
      { id: "12", file: "ch/12-load-balancing-gateways-rate-limiting.md", title: "Load balancing & rate limits", hook: "L4/L7, gateways, token bucket" },
      { id: "13", file: "ch/13-microservices-and-resilience.md", title: "Microservices & resilience", hook: "Retries, circuit breakers, sagas" },
      { id: "14", file: "ch/14-reliability-and-operations.md", title: "Reliability & operations", hook: "SLOs, observability, deploys" },
      { id: "15", file: "ch/15-security-basics.md",            title: "Security basics",          hook: "Auth, JWT, OAuth, common attacks" }
    ]},
    { name: "Part 4: HLD in practice", week: "Week 3", items: [
      { id: "16", file: "ch/16-hld-method.md",                 title: "The HLD method",           hook: "How to run a design conversation", flag: "key" },
      { id: "17", file: "ch/17-case-url-shortener-pastebin.md", title: "URL shortener & Pastebin", hook: "Key generation, redirects, caching" },
      { id: "18", file: "ch/18-case-rate-limiter-kv-store.md", title: "Rate limiter & KV store",  hook: "Redis + Lua, Dynamo-style store" },
      { id: "19", file: "ch/19-case-news-feed-chat.md",        title: "News feed & chat",         hook: "Fan-out, WebSockets, ordering" },
      { id: "20", file: "ch/20-case-video-files-notifications.md", title: "Video, file sync, notifications", hook: "Transcoding, chunking, channels" },
      { id: "21", file: "ch/21-case-typeahead-crawler-ad-serving.md", title: "Typeahead, crawler, ad serving", hook: "Tries, frontier, auctions in 100 ms" }
    ]},
    { name: "Part 5: Low-level design", week: "Week 4", items: [
      { id: "22", file: "ch/22-oop-and-solid.md",              title: "OOP & SOLID",              hook: "The foundation of LLD" },
      { id: "23", file: "ch/23-design-patterns.md",            title: "Design patterns",          hook: "The ones that actually come up" },
      { id: "24", file: "ch/24-lld-method-and-uml.md",         title: "LLD method & UML",         hook: "A repeatable process", flag: "key" },
      { id: "25", file: "ch/25-lld-case-studies.md",           title: "LLD case studies",         hook: "Parking lot, BookMyShow, Splitwise..." },
      { id: "26", file: "ch/26-concurrency-for-lld.md",        title: "Concurrency for LLD",      hook: "Locks, atomics, safe designs" }
    ]},
    { name: "Part 6: Confidence", week: "Ongoing", items: [
      { id: "27", file: "ch/27-talking-with-confidence.md",    title: "Talking with confidence",  hook: "Glossary, phrases, model answers", flag: "key" }
    ]},
    { name: "Runnable code", week: "verified", counts: false, items: [
      { id: "c01", file: "code/ParkingLot.java", title: "ParkingLot", hook: "Ch 25: strategy-based spot allocation", java: true },
      { id: "c02", file: "code/LruCache.java", title: "LruCache", hook: "Ch 25: O(1) hashmap + linked list", java: true },
      { id: "c03", file: "code/Splitwise.java", title: "Splitwise", hook: "Ch 25: split strategies, debt simplification", java: true },
      { id: "c04", file: "code/MovieBooking.java", title: "MovieBooking", hook: "Ch 25: seat holds under 50 racing users", java: true },
      { id: "c05", file: "code/ElevatorSystem.java", title: "ElevatorSystem", hook: "Ch 25: LOOK scheduling, states", java: true },
      { id: "c06", file: "code/TicTacToe.java", title: "TicTacToe", hook: "Ch 25: game modeling", java: true },
      { id: "c07", file: "code/LoggingFramework.java", title: "LoggingFramework", hook: "Ch 25: chain of responsibility", java: true },
      { id: "c08", file: "code/OopBasicsDemo.java", title: "OopBasicsDemo", hook: "Ch 22: inheritance vs composition", java: true },
      { id: "c09", file: "code/SolidDemo.java", title: "SolidDemo", hook: "Ch 22: each principle, broken then fixed", java: true },
      { id: "c10", file: "code/CreationalPatterns.java", title: "CreationalPatterns", hook: "Ch 23: singleton, factory, builder", java: true },
      { id: "c11", file: "code/StructuralPatterns.java", title: "StructuralPatterns", hook: "Ch 23: adapter, decorator, proxy...", java: true },
      { id: "c12", file: "code/BehavioralPatterns.java", title: "BehavioralPatterns", hook: "Ch 23: strategy, observer, state...", java: true },
      { id: "c13", file: "code/MeetingRoomBooking.java", title: "MeetingRoomBooking", hook: "Ch 24: the LLD method end to end", java: true },
      { id: "c14", file: "code/ModelingChoices.java", title: "ModelingChoices", hook: "Ch 24: enum vs sealed vs classes", java: true },
      { id: "c15", file: "code/LostUpdateDemo.java", title: "LostUpdateDemo", hook: "Ch 26: a race, then the fix", java: true },
      { id: "c16", file: "code/LocksDemo.java", title: "LocksDemo", hook: "Ch 26: locks, atomics, CAS", java: true },
      { id: "c17", file: "code/DeadlockDemo.java", title: "DeadlockDemo", hook: "Ch 26: real deadlock + lock ordering", java: true },
      { id: "c18", file: "code/ExecutorsDemo.java", title: "ExecutorsDemo", hook: "Ch 26: pools, futures, virtual threads", java: true },
      { id: "c19", file: "code/ProducerConsumer.java", title: "ProducerConsumer", hook: "Ch 26: BlockingQueue", java: true },
      { id: "c20", file: "code/TokenBucketRateLimiter.java", title: "TokenBucketRateLimiter", hook: "Ch 26: thread-safe limiter", java: true },
      { id: "c21", file: "code/ThreadSafeLru.java", title: "ThreadSafeLru", hook: "Ch 26: locking an LRU", java: true }
    ]}
  ];

  /* The compact edition mirrors the full one chapter for chapter: same titles,
     ids prefixed with "s", markdown served from cx/ instead of ch/. */
  var COMPACT_WEEKS = ["Sessions 1-2", "Sessions 3-5", "Sessions 5-6", "Sessions 7-8", "Session 9", "Session 10", "verified"];
  var COMPACT_PHASES = PHASES.map(function (p, pi) {
    return { name: p.name, week: COMPACT_WEEKS[pi] || p.week, counts: p.counts, items: p.items
      .filter(function (it) { return it.id !== "ft"; })
      .map(function (it) {
        var c = {};
        for (var k in it) c[k] = it[k];
        c.id = "s" + it.id;
        if (!it.java) c.file = it.file.replace("ch/", "cx/");
        if (it.id === "00") c.hook = "How this edition works, the 10 big ideas";
        return c;
      }) };
  });
  /* Quick notes: a one-screen first read / refresher for chapters 05-15. */
  var QUICK_IDS = ["05","06","07","08","09","10","11","12","13","14","15"];
  var QUICK_PHASES = [{ name: "Quick notes", week: "~15 min each", items: [] }];
  PHASES.forEach(function (p) {
    p.items.forEach(function (it) {
      if (QUICK_IDS.indexOf(it.id) < 0) return;
      QUICK_PHASES[0].items.push({ id: "q" + it.id, file: it.file.replace("ch/", "qx/"),
        title: it.title, hook: it.hook });
    });
  });
  var EDITIONS = { quick: QUICK_PHASES, compact: COMPACT_PHASES, full: PHASES };

  var byId = {};
  [["full", PHASES], ["compact", COMPACT_PHASES], ["quick", QUICK_PHASES]].forEach(function (e) {
    e[1].forEach(function (p) {
      p.items.forEach(function (it) { it.phase = p; it.edition = e[0]; byId[it.id] = it; });
    });
  });

  var edition = null, PH = [], ALL = [], COUNTED = [], TOTAL = 0;
  function setEdition(name) {
    edition = name; PH = EDITIONS[name]; ALL = []; COUNTED = [];
    PH.forEach(function (p) {
      p.items.forEach(function (it) { ALL.push(it); if (p.counts !== false) COUNTED.push(it); });
    });
    TOTAL = COUNTED.length;
    try { localStorage.setItem("learnsd.edition", name); } catch (e) {}
  }

  var el = {
    nav: document.getElementById("nav"),
    md: document.getElementById("md"),
    jump: document.getElementById("jump"),
    crumb: document.getElementById("crumb"),
    mark: document.getElementById("mark"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    rail: document.getElementById("rail"),
    scrim: document.getElementById("scrim"),
    menu: document.getElementById("menu"),
    theme: document.getElementById("theme"),
    meterN: document.getElementById("meter-n"),
    meterBar: document.getElementById("meter-bar")
  };
  var edBtns = { quick: document.getElementById("ed-quick"), compact: document.getElementById("ed-compact"), full: document.getElementById("ed-full") };
  var ED_NAME = { quick: "Quick", compact: "Compact", full: "Full" };
  var ED_SUB = {
    quick: "Chapters 05-15 on one screen each. Read first, revise anytime.",
    compact: "Every topic, taught by example. About 12 hours.",
    full: "The full course, about 30 hours, networking to class design."
  };
  function paintEdition() {
    document.getElementById("meter-t").textContent = TOTAL;
    document.getElementById("sub").textContent = ED_SUB[edition];
    Object.keys(edBtns).forEach(function (k) { edBtns[k].setAttribute("aria-pressed", k === edition ? "true" : "false"); });
  }
  function chapterNum(id) {
    if (id === "ft") return "00";
    return /^[sq]/.test(id) ? id.slice(1) : id;
  }
  function counterpart(id, target) {
    var n = chapterNum(id);
    if (target === "quick") return QUICK_IDS.indexOf(n) >= 0 ? "q" + n : "q05";
    if (target === "compact") return "s" + n;
    return n;
  }
  Object.keys(edBtns).forEach(function (k) {
    edBtns[k].addEventListener("click", function () {
      if (k === edition) return;
      var target = counterpart(current || "00", k);
      setEdition(k); paintEdition(); paintMeter();
      go(byId[target] ? target : (k === "compact" ? "s00" : "00"));
    });
  });

  /* ---------------- progress: db when available, localStorage otherwise -------- */
  var LS_KEY = "learnsd.progress.v1";
  var done = Object.create(null);
  var dbDoc = null;
  var saveTimer = null;

  function lsRead() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) JSON.parse(raw).forEach(function (id) { done[id] = true; });
    } catch (e) { /* storage unavailable */ }
  }
  function lsWrite() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(Object.keys(done))); } catch (e) {}
  }
  function persist() {
    lsWrite();
    if (!dbDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      dbDoc.set({ done: Object.keys(done), updatedAt: new Date().toISOString() })
           .catch(function () { /* read-only viewer: local copy still holds */ });
    }, 350);
  }

  lsRead();

  (async function () {
    try {
      var db = await window.claude?.use?.("db");
      if (!db) return;
      dbDoc = db.doc("progress/learn-system-design");
      var snap = await dbDoc.get();
      var stored = snap && snap.data && snap.data.done;
      if (Array.isArray(stored)) {
        stored.forEach(function (id) { done[id] = true; });
        lsWrite();
        renderNav(); paintMark(); paintMeter();
      }
    } catch (e) { /* stay on localStorage */ }
  })();

  /* ---------------- nav ---------------- */
  var current = null;
  var CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.6 9 10 3.2"/></svg>';

  function renderNav() {
    el.nav.textContent = "";
    PH.forEach(function (p) {
      if (!p.items.length) return;
      var sec = document.createElement("section");
      sec.className = "phase";
      var head = document.createElement("div");
      head.className = "phase-head";
      var n = document.createElement("span"); n.className = "phase-name"; n.textContent = p.name;
      var w = document.createElement("span"); w.className = "phase-week"; w.textContent = p.week;
      head.append(n, w);
      sec.append(head);

      p.items.forEach(function (it) {
        var row = document.createElement("div");
        row.className = "item" + (it.id === current ? " active" : "") + (done[it.id] ? " done" : "");

        var tick = document.createElement("button");
        tick.className = "tick"; tick.type = "button";
        tick.setAttribute("aria-pressed", done[it.id] ? "true" : "false");
        tick.setAttribute("aria-label", (done[it.id] ? "Mark unread: " : "Mark read: ") + it.title);
        tick.innerHTML = CHECK;
        tick.addEventListener("click", function (ev) { ev.stopPropagation(); toggle(it.id); });

        var num = document.createElement("span");
        num.className = "item-num";
        num.textContent = it.java ? "run" : it.id.replace(/^[sq]/, "");

        var body = document.createElement("button");
        body.className = "item-body"; body.type = "button";
        var t = document.createElement("span");
        t.className = "item-title"; t.textContent = it.title;
        if (it.flag) {
          var f = document.createElement("span");
          f.className = "flag"; f.textContent = it.flag;
          t.append(f);
        }
        var h = document.createElement("span");
        h.className = "item-hook"; h.textContent = it.hook;
        body.append(t, h);
        body.addEventListener("click", function () { go(it.id); });

        row.append(tick, num, body);
        sec.append(row);
      });
      el.nav.append(sec);
    });
  }

  function paintMeter() {
    var n = COUNTED.filter(function (it) { return done[it.id]; }).length;
    el.meterN.textContent = n;
    el.meterBar.style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + "%";
  }
  function paintMark() {
    var isDone = !!done[current];
    el.mark.textContent = isDone ? "Read" : "Mark read";
    el.mark.classList.toggle("is-done", isDone);
    el.mark.setAttribute("aria-pressed", isDone ? "true" : "false");
  }
  function toggle(id) {
    if (done[id]) delete done[id]; else done[id] = true;
    persist(); renderNav(); paintMeter();
    if (id === current) paintMark();
  }

  /* ---------------- markdown ---------------- */
  function slug(s) {
    return s.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 60);
  }

  function decorate() {
    el.md.querySelectorAll("table").forEach(function (t) {
      if (t.parentElement && t.parentElement.classList.contains("table-wrap")) return;
      var w = document.createElement("div");
      w.className = "table-wrap";
      t.parentNode.insertBefore(w, t);
      w.append(t);
    });

    el.md.querySelectorAll("pre code").forEach(function (b) {
      var isText = b.classList.contains("language-text") || !/language-/.test(b.className);
      if (isText) { b.parentElement.classList.add("diagram"); return; }
      if (window.hljs) { try { window.hljs.highlightElement(b); } catch (e) {} }
    });

    el.md.querySelectorAll("blockquote").forEach(function (q) {
      var s = q.querySelector("strong");
      if (s && /^common mistake/i.test(s.textContent)) q.classList.add("mistake");
      if (s && /^black box/i.test(s.textContent)) { q.classList.add("blackbox"); s.classList.add("chip"); }
    });

    el.md.querySelectorAll("p > strong:first-child").forEach(function (s) {
      if (s.parentElement.firstChild !== s) return;
      var label = s.textContent.trim();
      if (/^how it works$/i.test(label)) s.classList.add("chip", "chip-how");
      if (/^example$/i.test(label)) { s.classList.add("chip", "chip-ex"); s.parentElement.classList.add("ex-lead"); }
    });

    var hs = Array.prototype.slice.call(el.md.querySelectorAll("h2"));
    el.jump.textContent = "";
    if (hs.length >= 4) {
      var box = document.createElement("nav");
      box.className = "jump";
      box.setAttribute("aria-label", "On this page");
      var lab = document.createElement("span");
      lab.className = "jump-label"; lab.textContent = "On this page";
      var ul = document.createElement("ul");
      hs.forEach(function (h, i) {
        if (!h.id) h.id = slug(h.textContent) || ("s" + i);
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#" + current;
        a.textContent = h.textContent;
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          h.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        li.append(a); ul.append(li);
      });
      box.append(lab, ul);
      el.jump.append(box);
    }
  }

  /* Quick notes and compact chapters point at each other: read quick first, then compact. */
  function addCrossLink(it) {
    var old = document.querySelector(".xlink");
    if (old) old.remove();
    var n = chapterNum(it.id), target = null, label = "";
    if (edition === "quick") { target = "s" + n; label = "Next: the compact chapter, with full examples"; }
    else if (QUICK_IDS.indexOf(n) >= 0 && !it.java) { target = "q" + n; label = "Read the quick notes for this chapter first"; }
    if (!target || !byId[target]) return;
    var a = document.createElement("a");
    a.className = "xlink"; a.href = "#" + target;
    a.textContent = label + "  \u2192";
    el.jump.parentNode.insertBefore(a, el.jump);
  }

  var cache = Object.create(null);

  async function go(id) {
    var it = byId[id];
    if (!it) return;
    if (it.edition !== edition) { setEdition(it.edition); paintEdition(); paintMeter(); }
    current = id;
    renderNav(); paintMark();

    el.crumb.textContent = "";
    var b = document.createElement("b");
    b.textContent = ED_NAME[edition] + "  /  " + it.phase.name;
    el.crumb.append(b, document.createTextNode("  /  " + it.title));

    var i = ALL.indexOf(it);
    [[el.prev, ALL[i - 1]], [el.next, ALL[i + 1]]].forEach(function (pair) {
      var btn = pair[0], target = pair[1];
      btn.hidden = !target;
      if (target) {
        btn.querySelector(".nm").textContent = target.title;
        btn.onclick = function () { go(target.id); };
      }
    });

    window.scrollTo({ top: 0, behavior: "instant" });

    try {
      var text = cache[it.file];
      if (text == null) {
        var res = await fetch(it.file);
        if (!res.ok) throw new Error(res.status + "");
        text = await res.text();
        cache[it.file] = text;
      }
      var src = it.java ? ("# " + it.title + "\n\n```java\n" + text + "\n```\n") : text;
      el.md.innerHTML = window.marked.parse(src);
      decorate();
      addCrossLink(it);
    } catch (e) {
      el.md.textContent = "";
      var p = document.createElement("p");
      p.className = "loading";
      p.textContent = "Could not load " + it.file + ". Reload the page to try again.";
      el.md.append(p);
    }

    closeRail();
    if (history.replaceState) history.replaceState(null, "", "#" + id);
  }

  /* ---------------- chrome ---------------- */
  function openRail() { el.rail.classList.add("open"); el.scrim.classList.add("show"); }
  function closeRail() { el.rail.classList.remove("open"); el.scrim.classList.remove("show"); }

  el.menu.addEventListener("click", openRail);
  el.scrim.addEventListener("click", closeRail);
  el.mark.addEventListener("click", function () { if (current) toggle(current); });

  var THEME_KEY = "learnsd.theme";
  el.theme.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    if (!document.documentElement.hasAttribute("data-theme")) {
      dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "Escape") closeRail();
    if (e.key === "j" || e.key === "ArrowRight") { var n = ALL[ALL.indexOf(byId[current]) + 1]; if (n) go(n.id); }
    if (e.key === "k" || e.key === "ArrowLeft")  { var p = ALL[ALL.indexOf(byId[current]) - 1]; if (p) go(p.id); }
  });

  window.addEventListener("hashchange", function () {
    var id = location.hash.replace("#", "");
    if (byId[id] && id !== current) go(id);
  });

  if (window.marked && window.marked.setOptions) {
    window.marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
  }

  var start = location.hash.replace("#", "");
  var savedEd = null;
  try { savedEd = localStorage.getItem("learnsd.edition"); } catch (e) {}
  setEdition(byId[start] ? byId[start].edition : (EDITIONS[savedEd] ? savedEd : "compact"));
  paintEdition();
  renderNav();
  paintMeter();
  go(byId[start] ? start : (edition === "compact" ? "s00" : "00"));
})();
</script>
